name: AURA Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Gradle Wrapper
        run: |
          # Make wrapper scripts executable
          chmod +x gradlew gradlew.bat
          # Validate wrapper by checking version (this will download dependencies if needed)
          ./gradlew --version

      - name: Run Local Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run Lint Checks
        run: ./gradlew :app:lintDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-music-player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 14
          
      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/outputs/lint/
          retention-days: 14
